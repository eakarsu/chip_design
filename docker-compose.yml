services:
  migrate:
    profiles: [migrate]
    build:
      context: .
      target: migrator
    env_file: ${CHIP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      CHIP_ALLOW_SCHEMA_MIGRATION: "true"
      CHIP_DB_PATH: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/chip_design.db
      CHIP_EDA_OBJECT_DIR: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/eda-objects
      CHIP_BACKUP_DIR: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
    volumes:
      - type: bind
        source: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
        target: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
      - type: bind
        source: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
        target: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  web:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ${CHIP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      CHIP_DB_PATH: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/chip_design.db
      CHIP_EDA_OBJECT_DIR: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/eda-objects
      CHIP_BACKUP_DIR: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
    volumes:
      - type: bind
        source: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
        target: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
      - type: bind
        source: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
        target: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  eda-worker:
    profiles: [eda-worker]
    build:
      context: .
      target: eda-worker
    env_file: ${CHIP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      CHIP_DB_PATH: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/chip_design.db
      CHIP_EDA_OBJECT_DIR: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}/eda-objects
      CHIP_BACKUP_DIR: ${CHIP_HOST_BACKUP_DIR:?set CHIP_HOST_BACKUP_DIR}
      DOCKER_HOST: unix:///run/chip-engine.sock
    volumes:
      - type: bind
        source: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
        target: ${CHIP_HOST_DATA_DIR:?set CHIP_HOST_DATA_DIR}
      - type: bind
        source: ${CHIP_ROOTLESS_ENGINE_SOCKET:?set CHIP_ROOTLESS_ENGINE_SOCKET}
        target: /run/chip-engine.sock
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  enterprise-adapter:
    profiles: [enterprise-adapter]
    build:
      context: .
      target: enterprise-adapter
    env_file: ${CHIP_ADAPTER_ENV_FILE:-.env.adapter}
    environment:
      NODE_ENV: production
      CHIP_ADAPTER_HOST: 0.0.0.0
      CHIP_ADAPTER_PORT: 3010
    ports:
      - "127.0.0.1:${CHIP_ADAPTER_HOST_PORT:-5033}:3010"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  postgres:
    profiles: [commercial]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CHIP_POSTGRES_DB:-chip_design}
      POSTGRES_USER: ${CHIP_POSTGRES_USER:-chip_app}
      POSTGRES_PASSWORD: ${CHIP_POSTGRES_PASSWORD}
    volumes:
      - chip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  object-storage:
    profiles: [commercial]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CHIP_OBJECT_STORAGE_ACCESS_KEY:?set CHIP_OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CHIP_OBJECT_STORAGE_SECRET_KEY:?set CHIP_OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - chip-object-data:/data
    restart: unless-stopped

volumes:
  chip-postgres-data:
  chip-object-data:
