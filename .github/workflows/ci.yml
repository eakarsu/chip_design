name: governed-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chip_design
          POSTGRES_USER: chip_app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chip_app -d chip_design"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generate ephemeral CI deployment credentials
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${RUNNER_TEMP}/oidc-private.pem" 2>/dev/null
          openssl pkey -in "${RUNNER_TEMP}/oidc-private.pem" -pubout -out "${RUNNER_TEMP}/oidc-public.pem" 2>/dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${RUNNER_TEMP}/release-private.pem" 2>/dev/null
          {
            echo "CHIP_OIDC_INTERNAL_KEY_ID=ci"
            echo "CHIP_OIDC_INTERNAL_PRIVATE_KEY_BASE64=$(base64 -w 0 "${RUNNER_TEMP}/oidc-private.pem")"
            echo "CHIP_OIDC_PUBLIC_KEYS_JSON={\"ci\":\"$(base64 -w 0 "${RUNNER_TEMP}/oidc-public.pem")\"}"
            echo "CHIP_OBJECT_STORAGE_ACCESS_KEY=$(openssl rand -hex 16)"
            echo "CHIP_OBJECT_STORAGE_SECRET_KEY=$(openssl rand -hex 32)"
            echo "CHIP_ENTERPRISE_ADAPTER_URL=https://integrations.ci.example/chip-capabilities"
            echo "CHIP_ENTERPRISE_ADAPTER_TOKEN=$(openssl rand -hex 32)"
            echo "CHIP_RELEASE_SIGNING_PRIVATE_KEY_BASE64=$(base64 -w 0 "${RUNNER_TEMP}/release-private.pem")"
            echo "CHIP_RELEASE_SIGNING_KEY_ID=ci-release"
          } >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint:all
      - run: npm test -- --runInBand
      - run: npm run eda:golden
      - name: Replay governed migration and verify backup/restore
        env:
          NODE_ENV: production
          CHIP_ALLOW_SCHEMA_MIGRATION: "true"
          CHIP_ALLOW_DEMO_SEED: "false"
          CHIP_DB_PATH: ${{ runner.temp }}/chip-ci.sqlite3
          CHIP_EDA_OBJECT_DIR: ${{ runner.temp }}/chip-objects
          CHIP_BACKUP_DIR: ${{ runner.temp }}/chip-backups
          CHIP_OIDC_ISSUER: https://identity.ci.example
          CHIP_OIDC_AUDIENCE: chip-design-ci
          CHIP_YOSYS_IMAGE: registry.ci/yosys@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CHIP_OPENROAD_IMAGE: registry.ci/openroad@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CHIP_COMMERCIAL_DATABASE_URL: postgresql://chip_app@127.0.0.1:5432/chip_design
          CHIP_COMMERCIAL_DB_SSL: disable
          CHIP_OBJECT_STORAGE_BUCKET: ci-artifacts
          CHIP_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          CHIP_OBJECT_STORAGE_KMS_KEY: ci-ephemeral-kms-key
        run: |
          mkdir -p "$CHIP_EDA_OBJECT_DIR" "$CHIP_BACKUP_DIR"
          npm run migrate
          npm run migrate
          npm run check:production
          npm run backup:eda -- "${{ runner.temp }}/chip-backup"
          npm run restore:verify -- "${{ runner.temp }}/chip-backup"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  browser:
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --reporter=line

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t chip-web:ci .
      - run: docker build --target eda-worker -t chip-worker:ci .
      - run: docker build --target enterprise-adapter -t chip-enterprise-adapter:ci .

  approved-eda-golden:
    if: ${{ vars.CHIP_OPENROAD_IMAGE != '' && vars.CHIP_GOLDEN_BUNDLE != '' }}
    runs-on: [self-hosted, eda-golden]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker pull "$CHIP_OPENROAD_IMAGE"
        env:
          CHIP_OPENROAD_IMAGE: ${{ vars.CHIP_OPENROAD_IMAGE }}
      - run: npx tsx scripts/verify-golden.ts "$CHIP_GOLDEN_BUNDLE"
        env:
          CHIP_GOLDEN_BUNDLE: ${{ vars.CHIP_GOLDEN_BUNDLE }}
