limit_req_zone $binary_remote_addr zone=chip_integrations:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name integrations.chipdesign.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name integrations.chipdesign.shop;

    ssl_certificate /etc/letsencrypt/live/integrations.chipdesign.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integrations.chipdesign.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        limit_req zone=chip_integrations burst=20 nodelay;
        proxy_pass http://127.0.0.1:5033/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/capabilities {
        limit_req zone=chip_integrations burst=20 nodelay;
        proxy_pass http://127.0.0.1:5033/v1/capabilities;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
